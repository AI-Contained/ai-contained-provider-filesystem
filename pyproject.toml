[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-contained-provider-filesystem"
version = "0.0.2"
description = "Filesystem provider (fs_read, fs_write) for AI-Contained"
requires-python = ">=3.12"
dependencies = [
    "ai-contained-core-mcp",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-describe>=3.1",
    "assertpy>=1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "focus: run only focused tests (use with -m focus)",
]

[project.entry-points."ai_contained.provider"]
filesystem = "ai_contained.provider.filesystem:register"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_contained"]
